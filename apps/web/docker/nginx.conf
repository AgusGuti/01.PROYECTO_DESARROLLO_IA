# Serves the built Angular app and forwards API calls, so the browser sees a single origin.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  # Angular emits inline component styles, hence 'unsafe-inline' for style-src only.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  location /health/ {
    proxy_pass http://api:3000;
  }

  # Client-side routing: any other path is handled by the Angular router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
