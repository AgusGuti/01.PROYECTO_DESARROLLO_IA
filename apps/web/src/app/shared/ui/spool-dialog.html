<dialog
  #dialog
  [attr.aria-labelledby]="uid + '-title'"
  [attr.aria-describedby]="uid + '-text'"
  (cancel)="onCancelEvent($event)"
>
  <h2 [id]="uid + '-title'">{{ heading() }}</h2>
  <p [id]="uid + '-text'">{{ intro() }}</p>

  @if (options().length === 0) {
    <p role="status">No hay bobinas para elegir.</p>
  } @else {
    <div class="field">
      <label [for]="uid + '-select'">Bobina</label>
      <select
        #select
        [id]="uid + '-select'"
        [attr.aria-invalid]="missing() ? 'true' : null"
        [attr.aria-describedby]="missing() ? uid + '-error' : null"
        (change)="missing.set(false)"
      >
        <option value="">Elegí una bobina</option>
        @for (option of options(); track option.id) {
          <option [value]="option.id" [disabled]="option.disabled === true">
            {{ option.label }}
          </option>
        }
      </select>
      @if (missing()) {
        <p [id]="uid + '-error'" class="field-error" role="alert">Elegí una bobina.</p>
      }
    </div>
  }

  <p><a routerLink="/filamentos/nuevo">Crear una bobina nueva</a></p>

  <div class="actions">
    <button #cancelButton type="button" class="secondary" (click)="cancelled.emit()">
      Cancelar
    </button>
    @if (options().length > 0) {
      <button type="button" (click)="confirm()">{{ confirmLabel() }}</button>
    }
  </div>
</dialog>
