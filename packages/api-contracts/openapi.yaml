openapi: 3.1.0
info:
  title: Print3D Planner API
  version: 0.1.0
  description: REST API for 3D print management, costing and scheduling. Dates are RFC 3339 in UTC.
    Errors use RFC 9457 problem details (application/problem+json).
servers:
  - url: http://127.0.0.1:3000
    description: Local development
components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          example: urn:print3d:problem:not_found
        title:
          type: string
          example: Not found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: The requested resource does not exist.
        code:
          type: string
          enum:
            - validation_failed
            - unauthenticated
            - forbidden
            - not_found
            - conflict
            - payload_too_large
            - rate_limited
            - internal
            - service_unavailable
        requestId:
          type: string
          description: Quote this id when reporting a problem.
        issues:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
          description: Per-field validation problems.
      required:
        - type
        - title
        - status
        - detail
        - code
        - requestId
    Liveness:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        uptimeSeconds:
          type: integer
          minimum: 0
          example: 3600
        timestamp:
          type: string
          format: date-time
          example: 2026-01-01T12:00:00.000Z
      required:
        - status
        - uptimeSeconds
        - timestamp
    Readiness:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: object
          properties:
            database:
              type: string
              enum:
                - up
                - down
          required:
            - database
        timestamp:
          type: string
          format: date-time
          example: 2026-01-01T12:00:00.000Z
      required:
        - status
        - checks
        - timestamp
    Printer:
      type: object
      properties:
        id:
          type: string
          example: 66f0c0ffee0123456789abcd
        name:
          type: string
        buildVolume:
          $ref: "#/components/schemas/PrinterBuildVolume"
        nozzle:
          $ref: "#/components/schemas/PrinterNozzle"
        compatibleMaterials:
          type: array
          items:
            $ref: "#/components/schemas/Material"
        typicalSpeedMmS:
          type:
            - integer
            - "null"
        status:
          $ref: "#/components/schemas/PrinterStatus"
        version:
          type: integer
          description: Send this back when editing.
        archivedAt:
          type:
            - string
            - "null"
          format: date-time
          example: 2026-01-01T12:00:00.000Z
          description: Set while the printer waits to be removed ("Pendiente de eliminar").
        createdAt:
          type: string
          format: date-time
          example: 2026-01-01T12:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-01-01T12:00:00.000Z
      required:
        - id
        - name
        - buildVolume
        - nozzle
        - compatibleMaterials
        - typicalSpeedMmS
        - status
        - version
        - archivedAt
        - createdAt
        - updatedAt
    PrinterBuildVolume:
      type: object
      properties:
        x:
          type: integer
          minimum: 1
          maximum: 2000
        y:
          type: integer
          minimum: 1
          maximum: 2000
        z:
          type: integer
          minimum: 1
          maximum: 2000
      required:
        - x
        - y
        - z
      additionalProperties: false
      description: Usable print volume in millimetres.
    PrinterNozzle:
      type: object
      properties:
        diameterMm:
          anyOf:
            - type: number
              enum:
                - 0.2
            - type: number
              enum:
                - 0.25
            - type: number
              enum:
                - 0.4
            - type: number
              enum:
                - 0.6
            - type: number
              enum:
                - 0.8
            - type: number
              enum:
                - 1
        material:
          type: string
          enum:
            - brass
            - hardened_steel
            - stainless_steel
      required:
        - diameterMm
        - material
      additionalProperties: false
    Material:
      type: string
      enum:
        - PLA
        - PETG
        - ABS
        - ASA
        - TPU
        - PA
        - PC
        - HIPS
        - PVA
        - PP
        - PLA_CF
        - PETG_CF
        - PA_CF
        - PA_GF
    PrinterStatus:
      type: string
      enum:
        - available
        - in_use
        - maintenance
    CreatePrinterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Ender 3 Pro
        buildVolume:
          $ref: "#/components/schemas/PrinterBuildVolume"
        nozzle:
          $ref: "#/components/schemas/PrinterNozzle"
        compatibleMaterials:
          type: array
          items:
            $ref: "#/components/schemas/Material"
          minItems: 1
          maxItems: 14
        status:
          $ref: "#/components/schemas/PrinterStatus"
        typicalSpeedMmS:
          type: integer
          minimum: 1
          maximum: 1000
        restoreIfDeleted:
          type: boolean
          default: false
          description: Set to true to restore a deleted printer that holds this name, replacing its data with
            the submitted data. Without it, that name answers 409 (issue path "restoreIfDeleted").
      required:
        - name
        - buildVolume
        - nozzle
        - compatibleMaterials
      additionalProperties: false
    PrinterList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Printer"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
      required:
        - items
        - page
        - pageSize
        - total
    UpdatePrinterRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Ender 3 Pro
        buildVolume:
          $ref: "#/components/schemas/PrinterBuildVolume"
        nozzle:
          $ref: "#/components/schemas/PrinterNozzle"
        compatibleMaterials:
          type: array
          items:
            $ref: "#/components/schemas/Material"
          minItems: 1
          maxItems: 14
        typicalSpeedMmS:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 1000
        status:
          $ref: "#/components/schemas/PrinterStatus"
      required:
        - version
      additionalProperties: false
    Filament:
      type: object
      properties:
        id:
          type: string
          example: 66f0c0ffee0123456789abcd
        brand:
          type: string
        material:
          $ref: "#/components/schemas/Material"
        colorName:
          type: string
        initialGrams:
          type: integer
        availableGrams:
          type: integer
        purchaseCostMinor:
          type: integer
          description: Centavos of ARS. 1500000 means $15.000,00.
        purchaseDate:
          type: string
          format: date
          example: 2026-03-15
          description: YYYY-MM-DD, a calendar day (no time zone).
        version:
          type: integer
          description: Send this back when editing.
        createdAt:
          type: string
          format: date-time
          example: 2026-01-01T12:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-01-01T12:00:00.000Z
      required:
        - id
        - brand
        - material
        - colorName
        - initialGrams
        - availableGrams
        - purchaseCostMinor
        - purchaseDate
        - version
        - createdAt
        - updatedAt
    CreateFilamentRequest:
      type: object
      properties:
        brand:
          type: string
          minLength: 1
          maxLength: 60
          example: Grilon3
        material:
          $ref: "#/components/schemas/Material"
        colorName:
          type: string
          minLength: 1
          maxLength: 40
          example: Negro
        initialGrams:
          type: integer
          minimum: 1
          maximum: 20000
          description: Weight of the spool when bought, in grams.
        availableGrams:
          type: integer
          minimum: 0
          maximum: 20000
          description: Defaults to initialGrams (a new, unused spool).
        purchaseCostMinor:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: Purchase cost in centavos of Argentine pesos (ARS), an integer. 1500000 means $15.000,00.
        purchaseDate:
          type: string
          format: date
          example: 2026-03-15
          description: Calendar day of the purchase, YYYY-MM-DD (UTC). It cannot be later than today (UTC).
      required:
        - brand
        - material
        - colorName
        - initialGrams
        - purchaseCostMinor
        - purchaseDate
      additionalProperties: false
    FilamentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Filament"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
      required:
        - items
        - page
        - pageSize
        - total
    UpdateFilamentRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        brand:
          type: string
          minLength: 1
          maxLength: 60
          example: Grilon3
        material:
          $ref: "#/components/schemas/Material"
        colorName:
          type: string
          minLength: 1
          maxLength: 40
          example: Negro
        initialGrams:
          type: integer
          minimum: 1
          maximum: 20000
          description: Weight of the spool when bought, in grams.
        availableGrams:
          type: integer
          minimum: 0
          maximum: 20000
          description: Grams left on the spool. Never more than initialGrams.
        purchaseCostMinor:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: Purchase cost in centavos of Argentine pesos (ARS), an integer. 1500000 means $15.000,00.
        purchaseDate:
          type: string
          format: date
          example: 2026-03-15
          description: Calendar day of the purchase, YYYY-MM-DD (UTC). It cannot be later than today (UTC).
      required:
        - version
      additionalProperties: false
    ConsumeFilamentRequest:
      type: object
      properties:
        grams:
          type: integer
          minimum: 1
          maximum: 20000
          description: Grams to take from the spool.
      required:
        - grams
      additionalProperties: false
    Part:
      type: object
      properties:
        id:
          type: string
          example: 66f0c0ffee0123456789abcd
        name:
          type: string
        description:
          type:
            - string
            - "null"
        material:
          $ref: "#/components/schemas/Material"
        dimensionsMm:
          $ref: "#/components/schemas/PartDimensions"
        estimatedWeightGrams:
          type: integer
        estimatedPrintSeconds:
          type: integer
        layerHeightUm:
          type: integer
          description: "Micrometres: 200 means 0.2 mm."
        suggestedPrinterName:
          type:
            - string
            - "null"
        source:
          $ref: "#/components/schemas/PartSource"
        version:
          type: integer
          description: Send this back when editing.
        createdAt:
          type: string
          format: date-time
          example: 2026-01-01T12:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-01-01T12:00:00.000Z
      required:
        - id
        - name
        - description
        - material
        - dimensionsMm
        - estimatedWeightGrams
        - estimatedPrintSeconds
        - layerHeightUm
        - suggestedPrinterName
        - source
        - version
        - createdAt
        - updatedAt
    PartDimensions:
      type: object
      properties:
        x:
          type: integer
          minimum: 1
          maximum: 1000
        y:
          type: integer
          minimum: 1
          maximum: 1000
        z:
          type: integer
          minimum: 1
          maximum: 1000
      required:
        - x
        - y
        - z
      additionalProperties: false
      description: Bounding box in whole millimetres. Replaced whole when edited.
    PartSource:
      oneOf:
        - $ref: "#/components/schemas/ManualPartSource"
        - $ref: "#/components/schemas/GcodePartSource"
      discriminator:
        propertyName: kind
        mapping:
          manual: "#/components/schemas/ManualPartSource"
          gcode: "#/components/schemas/GcodePartSource"
    ManualPartSource:
      type: object
      properties:
        kind:
          type: string
          enum:
            - manual
      required:
        - kind
      additionalProperties: false
    GcodePartSource:
      type: object
      properties:
        kind:
          type: string
          enum:
            - gcode
        fileName:
          type: string
        slicer:
          type: string
          enum:
            - cura
        analyzedAt:
          type: string
          format: date-time
          example: 2026-01-01T12:00:00.000Z
          description: When the part was saved with this source (set by the server).
      required:
        - kind
        - fileName
        - slicer
        - analyzedAt
    CreatePartRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Soporte de estante en L
        description:
          type: string
          minLength: 1
          maxLength: 1000
          example: Soporte para estantes de 18 mm.
        material:
          $ref: "#/components/schemas/Material"
        dimensionsMm:
          $ref: "#/components/schemas/PartDimensions"
        estimatedWeightGrams:
          type: integer
          minimum: 1
          maximum: 20000
          description: Estimated weight in grams.
        estimatedPrintSeconds:
          type: integer
          minimum: 1
          maximum: 2592000
          description: Estimated print time in seconds (up to 30 days).
        layerHeightUm:
          type: integer
          minimum: 10
          maximum: 2000
          description: "Layer height in micrometres: 200 means 0.2 mm."
        suggestedPrinterName:
          type: string
          minLength: 1
          maxLength: 100
          example: Creality Ender-3 Pro
        source:
          $ref: "#/components/schemas/PartSourceInput"
      required:
        - name
        - material
        - dimensionsMm
        - estimatedWeightGrams
        - estimatedPrintSeconds
        - layerHeightUm
      additionalProperties: false
    PartSourceInput:
      oneOf:
        - $ref: "#/components/schemas/ManualPartSource"
        - $ref: "#/components/schemas/GcodePartSourceInput"
      discriminator:
        propertyName: kind
        mapping:
          manual: "#/components/schemas/ManualPartSource"
          gcode: "#/components/schemas/GcodePartSourceInput"
      default:
        kind: manual
      description: Defaults to {"kind":"manual"}.
    GcodePartSourceInput:
      type: object
      properties:
        kind:
          type: string
          enum:
            - gcode
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          example: soporte-celular.gcode
        slicer:
          type: string
          enum:
            - cura
      required:
        - kind
        - fileName
        - slicer
      additionalProperties: false
    PartList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Part"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
      required:
        - items
        - page
        - pageSize
        - total
    UpdatePartRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Soporte de estante en L
        description:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 1000
          example: Soporte para estantes de 18 mm.
        material:
          $ref: "#/components/schemas/Material"
        dimensionsMm:
          $ref: "#/components/schemas/PartDimensions"
        estimatedWeightGrams:
          type: integer
          minimum: 1
          maximum: 20000
          description: Estimated weight in grams.
        estimatedPrintSeconds:
          type: integer
          minimum: 1
          maximum: 2592000
          description: Estimated print time in seconds (up to 30 days).
        layerHeightUm:
          type: integer
          minimum: 10
          maximum: 2000
          description: "Layer height in micrometres: 200 means 0.2 mm."
        suggestedPrinterName:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 100
          example: Creality Ender-3 Pro
        source:
          $ref: "#/components/schemas/PartSourceInput"
      required:
        - version
      additionalProperties: false
    PartUsage:
      type: object
      properties:
        total:
          type: integer
          description: All live projects that use the part.
        projects:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              quantity:
                type: integer
            required:
              - id
              - name
              - quantity
          description: At most 50, sorted by name then id.
      required:
        - total
        - projects
    Project:
      type: object
      properties:
        id:
          type: string
          example: 66f0c0ffee0123456789abcd
        name:
          type: string
        description:
          type:
            - string
            - "null"
        priority:
          type: string
          enum:
            - low
            - normal
            - high
            - urgent
          description: "From the least to the most urgent: low, normal, high, urgent."
        deadline:
          type: &a1
            - string
            - "null"
          format: date
          example: 2026-11-30
          description: YYYY-MM-DD, a calendar day (no time zone), or null.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectItem"
        version:
          type: integer
          description: Send this back when editing.
        createdAt:
          type: string
          format: date-time
          example: 2026-01-01T12:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-01-01T12:00:00.000Z
      required:
        - id
        - name
        - description
        - priority
        - deadline
        - items
        - version
        - createdAt
        - updatedAt
    ProjectItem:
      type: object
      properties:
        partId:
          type: string
          example: 66f0c0ffee0123456789abcd
        quantity:
          type: integer
        part:
          type:
            - object
            - "null"
          properties:
            name:
              type: string
            material:
              $ref: "#/components/schemas/Material"
          required:
            - name
            - material
          description: The part as it is now, or null when it is no longer live ("deleted").
      required:
        - partId
        - quantity
        - part
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Soportes para el taller
        description:
          type: string
          minLength: 1
          maxLength: 1000
          example: Estantes y herramientas del taller.
        priority:
          type: string
          enum:
            - low
            - normal
            - high
            - urgent
          default: normal
          description: "From the least to the most urgent: low, normal, high, urgent."
        deadline:
          type: string
          format: date
          example: 2026-11-30
          description: YYYY-MM-DD, a calendar day (no time zone), years 2000..2099. A past day is allowed.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectItemInput"
          maxItems: 100
          default: []
          description: Up to 100 lines, each part at most once, every part must exist. Replaced whole on edit.
      required:
        - name
      additionalProperties: false
    ProjectItemInput:
      type: object
      properties:
        partId:
          type: string
          pattern: ^[0-9a-f]{24}$/i
          example: 66f0c0ffee0123456789abcd
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
      required:
        - partId
        - quantity
      additionalProperties: false
    ProjectList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
      required:
        - items
        - page
        - pageSize
        - total
    ProjectSummary:
      type: object
      properties:
        id:
          type: string
          example: 66f0c0ffee0123456789abcd
        name:
          type: string
        description:
          type:
            - string
            - "null"
        priority:
          type: string
          enum:
            - low
            - normal
            - high
            - urgent
          description: "From the least to the most urgent: low, normal, high, urgent."
        deadline:
          type: *a1
          format: date
          example: 2026-11-30
          description: YYYY-MM-DD, a calendar day (no time zone), or null.
        itemCount:
          type: integer
          description: Number of lines.
        unitCount:
          type: integer
          description: Sum of the quantities.
        createdAt:
          type: string
          format: date-time
          example: 2026-01-01T12:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-01-01T12:00:00.000Z
      required:
        - id
        - name
        - description
        - priority
        - deadline
        - itemCount
        - unitCount
        - createdAt
        - updatedAt
    UpdateProjectRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Soportes para el taller
        description:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 1000
          example: Estantes y herramientas del taller.
        priority:
          type: string
          enum:
            - low
            - normal
            - high
            - urgent
          description: "From the least to the most urgent: low, normal, high, urgent."
        deadline:
          type:
            - string
            - "null"
          format: date
          example: 2026-11-30
          description: YYYY-MM-DD, a calendar day (no time zone), years 2000..2099. A past day is allowed.
            null clears it.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectItemInput"
          maxItems: 100
          description: Up to 100 lines, each part at most once, every part must exist. Replaced whole on edit.
      required:
        - version
      additionalProperties: false
    GcodeAnalysis:
      type: object
      properties:
        slicer:
          type: string
          enum:
            - cura
        estimatedPrintSeconds:
          type: integer
        filamentMm:
          type: integer
          description: Filament length, all extruders.
        filamentGrams:
          type:
            - integer
            - "null"
          description: Estimated from a density table (ADR 0015). Null without a material.
        layerHeightUm:
          type:
            - integer
            - "null"
        dimensionsMm:
          type:
            - object
            - "null"
          properties:
            x:
              type: integer
            y:
              type: integer
            z:
              type: integer
          required:
            - x
            - y
            - z
          description: Bounding box in whole millimetres, rounded up. Includes skirt and brim.
        targetMachineName:
          type:
            - string
            - "null"
          description: The slicer machine name, kept only if it is printable ASCII.
        warnings:
          type: array
          items:
            type: object
            properties:
              code:
                $ref: "#/components/schemas/GcodeWarningCode"
            required:
              - code
      required:
        - slicer
        - estimatedPrintSeconds
        - filamentMm
        - filamentGrams
        - layerHeightUm
        - dimensionsMm
        - targetMachineName
        - warnings
    GcodeWarningCode:
      type: string
      enum:
        - GRAMS_FROM_DENSITY_TABLE
        - MATERIAL_NOT_SELECTED
        - WEIGHT_OUT_OF_RANGE
        - LAYER_HEIGHT_UNAVAILABLE
        - DIMENSIONS_UNAVAILABLE
        - DIMENSIONS_INCLUDE_SKIRT_OR_BRIM
        - MULTIPLE_EXTRUDERS_SUMMED
    AnalyzeGcodeRequest:
      type: object
      properties:
        head:
          type: string
          minLength: 1
          maxLength: 65536
          description: The first 65536 characters of the .gcode file, exactly as read (not trimmed). It is
            never stored or logged.
        material:
          allOf:
            - $ref: "#/components/schemas/Material"
            - description: Needed to estimate the weight in grams.
      required:
        - head
      additionalProperties: false
  parameters: {}
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags:
        - Health
      summary: Is the process running?
