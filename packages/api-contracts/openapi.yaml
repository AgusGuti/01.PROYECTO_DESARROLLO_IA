              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such printer, or it was removed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updatePrinter
      tags:
        - Printers
      summary: Edit a printer
      description: "Send the `version` you last saw plus the fields to change. Nested objects and
        `compatibleMaterials` are replaced whole; `typicalSpeedMmS: null` clears the speed."
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{24}$/i
            example: 66f0c0ffee0123456789abcd
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePrinterRequest"
      responses:
        "200":
          description: The updated printer, with its new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Printer"
        "400":
          description: Invalid input, or the merged state breaks a rule.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such printer, or it was removed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Stale version (issue path "version"), duplicate name (path "name"), or the printer is
