    UpdateScheduleRequest:
      type: object
      properties:
        weekly:
          type: array
          items:
            type: object
            properties:
              ranges:
                type: array
                items:
                  $ref: "#/components/schemas/InterventionRange"
                maxItems: 6
                description: Where the user CAN intervene. Outside these ranges the user cannot.
            required:
              - ranges
            additionalProperties: false
          description: "Exactly 7 entries: index 0 is Monday, 6 is Sunday."
        exceptions:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                example: 2026-12-25
              ranges:
                type: array
                items:
                  $ref: "#/components/schemas/InterventionRange"
                maxItems: 6
                description: "Replaces that day. Empty: no intervention at all."
            required:
              - date
              - ranges
            additionalProperties: false
          maxItems: 60
        absences:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
                format: date
                example: 2026-12-25
                description: First day of the absence, inclusive.
              to:
                type: string
                format: date
                example: 2026-12-25
                description: Last day of the absence, inclusive.
            required:
              - from
              - to
            additionalProperties: false
          maxItems: 30
          description: Up to 30 day ranges with no intervention at all; they override exceptions.
        version:
          type: integer
          minimum: 0
          description: 0 for the first save, otherwise the version last seen (ADR 0024).
      required:
        - weekly
        - exceptions
        - absences
        - version
      additionalProperties: false
    InterventionRange:
      type: object
