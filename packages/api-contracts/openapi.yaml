          description: "From the least to the most urgent: low, normal, high, urgent."
          name: priority
          in: query
        - schema:
            type: string
            enum:
              - deadline
              - priority
              - name
              - createdAt
            default: createdAt
            description: A project without a deadline comes last in both directions when sorting by it.
          required: false
          description: A project without a deadline comes last in both directions when sorting by it.
          name: sort
          in: query
        - schema:
            type: string
            enum:
