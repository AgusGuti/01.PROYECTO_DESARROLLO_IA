            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The project has no queue.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Stale version (issue path "version").
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The part, printer or queue data is temporarily unavailable.
