          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The project already has a queue (issue path "projectId").
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
