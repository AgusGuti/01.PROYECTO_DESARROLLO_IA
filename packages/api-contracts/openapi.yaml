  /api/v1/costs/estimates:
    post:
      operationId: estimateCost
      tags:
        - Costs
      summary: Estimate the cost of printing a part
      description: "Stateless: nothing is stored. Every amount is an integer in centavos of ARS and the
        lines add up to the total. A margin is added only when marginBasisPoints is sent. Unknown
        ids are reported together as issues on partId, filamentId and printerId."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CostEstimateRequest"
      responses:
        "200":
          description: The estimate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostEstimate"
        "400":
          description: Invalid input, an unknown part, spool or printer, a spool material that differs from
            the part material (issue path "filamentId"), or amounts too large (path "quantity").
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The part, spool, printer or settings data is temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/costs/project-estimates:
    post:
      operationId: estimateProjectCost
      tags:
        - Costs
      summary: Estimate the total cost of a project
      description: "Stateless: nothing is stored. Each line is costed alone (spool, printer and margin per
        line); the settings fixed cost is added once for the whole project and carries no margin.
        Totals are sums of the rounded lines, in centavos of ARS."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCostEstimateRequest"
      responses:
        "200":
          description: The project estimate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCostEstimate"
        "400":
          description: Invalid input; unknown part, spool or printer, or a material mismatch (paths
            "lines.N.partId|filamentId|printerId"); amounts too large (path "lines.N.quantity", or
            "lines" when only the sum overflows).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The part, spool, printer or settings data is temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
