            type: string
            pattern: ^[0-9a-f]{24}$/i
            example: 66f0c0ffee0123456789abcd
          required: true
          name: projectId
          in: path
        - schema:
            type: integer
            minimum: 1
          required: true
          name: version
          in: query
      responses:
        "204":
          description: Deleted.
        "400":
          description: Malformed id or missing version.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The project has no queue.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Stale version (issue path "version").
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/simulations:
    post:
      operationId: simulatePlanning
      tags:
        - Simulations
      summary: Simulate the planning of a project with a naive ordering
      description: "Stateless: nothing is saved. Places every remaining unit of the project queue, in line
        order, on the printer that is free earliest. A print starts, and is collected, only when the
        intervention schedule allows. Work that would start more than 14 days after `startAt` is
        reported in `unplaced`. All times are Argentina wall-clock `YYYY-MM-DDTHH:mm`."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationRequest"
      responses:
        "200":
          description: The simulated timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Simulation"
        "400":
          description: 'Invalid input. Issue path "projectId": the project does not exist or has no queue;
            "lines": more than 1000 units left; "printerIds": no selected printer is available.'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The queue, project, part, printer or schedule data is temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/simulations/optimizations:
    post:
      operationId: optimizePlanning
      tags:
        - Simulations
      summary: Optimise the print order of a project for its goal
      description: "Stateless: nothing is saved. Tries several explainable strategies with the same
        scheduler (earliest-free printer, starts and collections only at intervention minutes,
        14-day horizon) and returns the best for the queue goal, never worse than the naive
        baseline. Identical pieces of a part may share a plate (never different parts). `candidates`
        lists what was tried. All times are Argentina wall-clock `YYYY-MM-DDTHH:mm`."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationRequest"
      responses:
        "200":
          description: The optimised plan, the naive baseline and their comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Optimization"
        "400":
          description: 'Invalid input. Issue path "projectId": the project does not exist or has no queue;
            "lines": more than 1000 units left; "printerIds": no selected printer is available.'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The queue, project, part, printer, schedule or planning settings data is temporarily
            unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/gcode-analyses:
    post:
      operationId: analyzeGcode
      tags:
        - G-code
      summary: Read the estimates from the head of a Cura G-code file
      description: "Stateless: nothing is stored and the text is never logged or returned. It answers 200
        because it creates no resource. Only Cura (Marlin or RepRap flavour) is recognised."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeGcodeRequest"
      responses:
        "200":
          description: The numbers found, with warning codes about how reliable they are.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcodeAnalysis"
        "400":
          description: Invalid input, or the head is not a supported Cura header (issue path "head").
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The request body is over the size limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/chat:
    post:
      operationId: askAssistant
      tags:
        - Chat
      summary: Send one message to the assistant
      description: "Stateless: nothing is stored and there is no conversation history. The API forwards
        the message to the assistant (ADR 0004, 0029) and returns its reply, plus an optional
        proposal (ADR 0031). It can take many seconds."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: The assistant reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: 'Invalid input. Issue path "message": empty, too long (over 2000) or unknown key.'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The assistant is unreachable, timed out or answered something unusable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/gcode-imports:
    post:
      operationId: importGcodes
      tags:
        - Chat
      summary: Import the .gcode files of a folder as parts (confirmed assistant proposal)
      description: "Sent by the browser only after the user confirmed an import_gcodes proposal (ADR
        0035). The API forwards it to the assistant, which runs the local G-code import for its
        configured folder. One material per batch. Idempotent (ADR 0034): parts already imported
        from the same file are updated or left alone. It can take minutes."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GcodeImportRequest"
      responses:
        "200":
          description: How many files were created, updated, left unchanged, skipped or failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcodeImportResult"
        "400":
          description: "Invalid input: unknown material, unsafe folder or unknown key."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The assistant or the import is unreachable, off, timed out or unusable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
webhooks: {}
