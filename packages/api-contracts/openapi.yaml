                required:
                  - printerId
                  - name
                  - jobs
                  - busyMinutes
                  - idleMinutes
            totals:
              type: object
              properties:
                placedPlates:
                  type: integer
                  description: Plates printed; each is one collection of the printer.
                placedUnits:
                  type: integer
                unplacedUnits:
                  type: integer
                finishAt:
                  type:
                    - string
                    - "null"
                  example: 2026-03-02T08:00
                  description: The last handoff, if any.
                totalBusyMinutes:
                  type: integer
                totalIdleMinutes:
                  type: integer
              required:
                - placedPlates
                - placedUnits
                - unplacedUnits
                - finishAt
                - totalBusyMinutes
                - totalIdleMinutes
            deadline:
              type: object
              properties:
                date:
                  type:
                    - string
                    - "null"
                  example: 2026-03-20
                met:
                  type:
                    - boolean
                    - "null"
                  description: Null without a deadline or with nothing to place; false if anything is unplaced.
              required:
                - date
                - met
            unplaced:
              type: array
              items:
                type: object
                properties:
                  partId:
                    type: string
                    pattern: ^[0-9a-f]{24}$/i
                    example: 66f0c0ffee0123456789abcd
                  partName:
                    type: string
                  units:
                    type: integer
                required:
                  - partId
                  - partName
                  - units
          required:
            - jobs
            - printers
            - totals
            - deadline
            - unplaced
        comparison:
          type: object
          properties:
            finishDeltaMinutes:
              type:
                - integer
                - "null"
              description: optimized - baseline finish, negative is better. Null if only one placed.
            idleDeltaMinutes:
              type: integer
              description: optimized - baseline idle, negative is better.
            deadlineChanged:
              type: string
              enum:
                - gained
                - lost
                - same
                - unknown
          required:
            - finishDeltaMinutes
            - idleDeltaMinutes
            - deadlineChanged
        candidates:
          type: array
          items:
            type: object
            properties:
              strategy:
                allOf:
                  - $ref: "#/components/schemas/OptimizationStrategy"
                  - description: "naive: the CU10 result. queue_order: queue order with batching. longest_first and
                      shortest_first: plates sorted by duration. best_fit: at each start, the plate
                      that leaves the least waiting time before it is collected."
              finishAt:
                type:
                  - string
                  - "null"
                example: 2026-03-02T08:00
                description: "Wall-clock time of America/Argentina/Buenos_Aires: YYYY-MM-DDTHH:mm."
              totalIdleMinutes:
                type: integer
              deadlineMet:
                type:
                  - boolean
                  - "null"
              placedUnits:
                type: integer
              unplacedUnits:
                type: integer
            required:
              - strategy
              - finishAt
              - totalIdleMinutes
              - deadlineMet
              - placedUnits
              - unplacedUnits
          description: Every strategy that was tried, for explainability.
        warnings:
          type: array
          items:
            type: object
            properties:
              code:
                $ref: "#/components/schemas/SimulationWarningCode"
            required:
              - code
      required:
        - projectId
        - goal
        - startAt
        - strategy
        - baseline
        - optimized
        - comparison
        - candidates
        - warnings
    OptimizationStrategy:
      type: string
      enum:
        - naive
        - queue_order
        - longest_first
        - shortest_first
        - best_fit
      description: The strategy whose plan is `optimized`.
    GcodeAnalysis:
      type: object
      properties:
        slicer:
          type: string
          enum:
            - cura
        estimatedPrintSeconds:
          type: integer
        filamentMm:
          type: integer
          description: Filament length, all extruders.
        filamentGrams:
          type:
            - integer
            - "null"
          description: Estimated from a density table (ADR 0015). Null without a material.
        layerHeightUm:
          type:
            - integer
            - "null"
        dimensionsMm:
          type:
            - object
            - "null"
          properties:
            x:
              type: integer
            y:
              type: integer
            z:
              type: integer
          required:
            - x
            - y
            - z
          description: Bounding box in whole millimetres, rounded up. Includes skirt and brim.
        targetMachineName:
          type:
            - string
            - "null"
          description: The slicer machine name, kept only if it is printable ASCII.
        warnings:
          type: array
          items:
            type: object
            properties:
              code:
                $ref: "#/components/schemas/GcodeWarningCode"
            required:
              - code
      required:
        - slicer
        - estimatedPrintSeconds
        - filamentMm
        - filamentGrams
        - layerHeightUm
        - dimensionsMm
        - targetMachineName
        - warnings
    GcodeWarningCode:
      type: string
      enum:
        - GRAMS_FROM_DENSITY_TABLE
        - MATERIAL_NOT_SELECTED
        - WEIGHT_OUT_OF_RANGE
        - LAYER_HEIGHT_UNAVAILABLE
        - DIMENSIONS_UNAVAILABLE
        - DIMENSIONS_INCLUDE_SKIRT_OR_BRIM
        - MULTIPLE_EXTRUDERS_SUMMED
    AnalyzeGcodeRequest:
      type: object
      properties:
        head:
          type: string
          minLength: 1
          maxLength: 65536
          description: The first 65536 characters of the .gcode file, exactly as read (not trimmed). It is
            never stored or logged.
        material:
          allOf:
            - $ref: "#/components/schemas/Material"
            - description: Needed to estimate the weight in grams.
      required:
        - head
      additionalProperties: false
    ChatResponse:
      type: object
      properties:
        reply:
          type: string
          maxLength: 10000
          description: The assistant reply.
        proposal:
          $ref: "#/components/schemas/AssistantProposal"
      required:
        - reply
        - proposal
      additionalProperties: false
    AssistantProposal:
      oneOf:
        - $ref: "#/components/schemas/ProposalCreateProject"
        - $ref: "#/components/schemas/ProposalCreateQueue"
        - $ref: "#/components/schemas/ProposalUpdateQueueProgress"
        - $ref: "#/components/schemas/ProposalImportGcodes"
        - type: "null"
      description: "A suggested action. It is NOT executed: the browser shows it, and only after the user
        confirms does it send the payload to POST /api/v1/projects (create_project) or POST
        /api/v1/queues (create_queue, the queues API copies the project lines) or PATCH
        /api/v1/queues/{projectId} with { version, lines } (update_queue_progress), which validate
        it again. An import_gcodes proposal is confirmed with POST /api/v1/gcode-imports (ADR
        0035)."
    ProposalCreateProject:
      type: object
      properties:
        kind:
          type: string
          enum:
            - create_project
        payload:
          $ref: "#/components/schemas/ProposalCreateProjectPayload"
        itemNames:
          type: array
          items:
            type: object
            properties:
              partId:
                type: string
                example: 66f0c0ffee0123456789abcd
              name:
                type: string
                minLength: 1
                maxLength: 100
                example: Soporte de estante
            required:
              - partId
              - name
            additionalProperties: false
          maxItems: 100
      required:
        - kind
        - payload
        - itemNames
      additionalProperties: false
    ProposalCreateProjectPayload:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Soportes para el taller
        description:
          type: string
          minLength: 1
          maxLength: 1000
          example: Estantes y herramientas del taller.
        priority:
          type: string
          enum:
            - low
            - normal
            - high
            - urgent
        deadline:
          type: string
          format: date
          example: 2026-11-30
        items:
          type: array
          items:
            type: object
            properties:
              partId:
                type: string
                example: 66f0c0ffee0123456789abcd
              quantity:
                type: integer
                minimum: 1
                maximum: 1000
            required:
              - partId
              - quantity
            additionalProperties: false
          maxItems: 100
      required:
        - name
      additionalProperties: false
    ProposalCreateQueue:
      type: object
      properties:
        kind:
          type: string
          enum:
            - create_queue
        payload:
          $ref: "#/components/schemas/ProposalCreateQueuePayload"
        projectName:
          type: string
          minLength: 1
          maxLength: 100
          example: Soportes para el taller
        printerNames:
          type: array
          items:
            type: object
            properties:
              printerId:
                type: string
                example: 66f0c0ffee0123456789abcd
              name:
                type: string
                minLength: 1
                maxLength: 100
                example: Prusa MK4
            required:
              - printerId
              - name
            additionalProperties: false
          maxItems: 10
      required:
        - kind
        - payload
        - projectName
        - printerNames
      additionalProperties: false
    ProposalCreateQueuePayload:
      type: object
      properties:
        projectId:
          type: string
          example: 66f0c0ffee0123456789abcd
        goal:
          type: string
          enum:
            - deadline
            - fastest
            - minimal_idle
        mode:
          type: string
          enum:
            - single
            - multi
        printerIds:
          type: array
          items:
            type: string
            example: 66f0c0ffee0123456789abcd
          minItems: 1
          maxItems: 10
      required:
        - projectId
        - goal
        - mode
        - printerIds
      additionalProperties: false
    ProposalUpdateQueueProgress:
      type: object
      properties:
        kind:
          type: string
          enum:
            - update_queue_progress
        payload:
          $ref: "#/components/schemas/ProposalUpdateQueueProgressPayload"
        projectName:
          type: string
          minLength: 1
          maxLength: 100
          example: Soportes para el taller
        lineNames:
          type: array
          items:
            type: object
            properties:
              partId:
                type: string
                example: 66f0c0ffee0123456789abcd
              name:
                type: string
                minLength: 1
                maxLength: 100
                example: Soporte de estante
            required:
              - partId
              - name
            additionalProperties: false
          maxItems: 100
      required:
        - kind
        - payload
        - projectName
        - lineNames
      additionalProperties: false
    ProposalUpdateQueueProgressPayload:
      type: object
      properties:
        projectId:
          type: string
          example: 66f0c0ffee0123456789abcd
        version:
          type: integer
          minimum: 1
        lines:
          type: array
          items:
            type: object
            properties:
              partId:
                type: string
                example: 66f0c0ffee0123456789abcd
              quantity:
                type: integer
                minimum: 1
                maximum: 1000
              completed:
                type: integer
                minimum: 0
                maximum: 1000
            required:
              - partId
              - quantity
              - completed
            additionalProperties: false
          minItems: 1
          maxItems: 100
      required:
        - projectId
        - version
        - lines
      additionalProperties: false
    ProposalImportGcodes:
      type: object
      properties:
        kind:
          type: string
          enum:
            - import_gcodes
        payload:
          $ref: "#/components/schemas/GcodeImportRequest"
      required:
        - kind
        - payload
      additionalProperties: false
    GcodeImportRequest:
      type: object
      properties:
        material:
          allOf:
            - $ref: "#/components/schemas/Material"
            - description: "One material for every file in the batch: a G-code file does not state it."
        folder:
          type: string
          minLength: 1
          maxLength: 200
          example: Minis/0.3mm
      required:
        - material
      additionalProperties: false
    ChatRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: The user message, trimmed. It is never stored or logged.
      required:
        - message
      additionalProperties: false
    GcodeImportResult:
      type: object
      properties:
        created:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        errors:
          type: integer
          minimum: 0
      required:
        - created
        - updated
        - unchanged
        - skipped
        - errors
      additionalProperties: false
  parameters: {}
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags:
        - Health
      summary: Is the process running?
      description: Liveness probe. Does not check dependencies. Not rate limited.
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/ready:
    get:
      operationId: getReadiness
      tags:
        - Health
      summary: Can the API serve traffic?
      description: Readiness probe. Checks the database connection. Not rate limited.
      responses:
        "200":
          description: Every dependency is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: A dependency is down. The body says which one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/printers:
    post:
      operationId: createPrinter
      tags:
        - Printers
      summary: Register a printer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrinterRequest"
      responses:
        "200":
          description: Restored. A deleted printer with this name was revived with the submitted data (only
            with restoreIfDeleted true). The Location header points to it.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Printer"
        "201":
          description: Created. The Location header points to the new printer.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Printer"
        "400":
          description: Invalid input, or a reinforced material without a hardened_steel nozzle.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: 'The name is taken. Issue path "name": a live or pending-removal printer holds it.
            Issue path "restoreIfDeleted": a deleted printer holds it; resend with restoreIfDeleted
            true to restore it.'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listPrinters
      tags:
        - Printers
      summary: List printers
      description: Includes printers pending removal (archivedAt set). Removed printers are not listed.
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: pageSize
          in: query
        - schema:
            type: string
            enum:
              - available
              - in_use
              - maintenance
          required: false
          name: status
          in: query
        - schema:
            type: string
            enum:
              - name
              - createdAt
            default: name
          required: false
          name: sort
          in: query
        - schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          required: false
          name: order
          in: query
      responses:
        "200":
          description: One page of printers. A page past the last one is empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterList"
        "400":
          description: Unknown or invalid query parameter.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/printers/{id}/unarchive:
    post:
      operationId: unarchivePrinter
      tags:
        - Printers
      summary: Cancel the pending removal of a printer
      description: Clears archivedAt so the printer can be edited again. Repeating it on a printer that is
        not pending removal is a 200 with no change.
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{24}$/i
            example: 66f0c0ffee0123456789abcd
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The printer, no longer pending removal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Printer"
        "400":
          description: Malformed id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such printer, or it was removed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/printers/{id}:
    get:
      operationId: getPrinter
      tags:
        - Printers
      summary: Get one printer
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{24}$/i
            example: 66f0c0ffee0123456789abcd
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The printer (also when it is pending removal).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Printer"
        "400":
          description: Malformed id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such printer, or it was removed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updatePrinter
      tags:
        - Printers
      summary: Edit a printer
      description: "Send the `version` you last saw plus the fields to change. Nested objects and
        `compatibleMaterials` are replaced whole; `typicalSpeedMmS: null` and `powerWatts: null`
        clear those values."
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{24}$/i
            example: 66f0c0ffee0123456789abcd
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePrinterRequest"
      responses:
        "200":
          description: The updated printer, with its new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Printer"
        "400":
          description: Invalid input, or the merged state breaks a rule.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such printer, or it was removed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Stale version (issue path "version"), duplicate name (path "name"), or the printer is
            pending removal.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deletePrinter
      tags:
        - Printers
      summary: Remove a printer
      description: Never physical. An idle printer is removed; one in use or with assignments becomes
        pending removal (archivedAt set). Repeating the request on a pending printer is a 204.
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{24}$/i
            example: 66f0c0ffee0123456789abcd
          required: true
          name: id
          in: path
      responses:
        "204":
          description: Removed, or pending removal.
        "400":
          description: Malformed id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such printer, or it was already removed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/filaments:
    post:
      operationId: createFilament
      tags:
        - Filaments
      summary: Register a filament spool
      description: "Two identical spools are allowed: there is no uniqueness rule."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFilamentRequest"
      responses:
        "201":
          description: Created. The Location header points to the new filament.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Filament"
        "400":
          description: Invalid input, availableGrams above initialGrams, or a purchase date in the future.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listFilaments
      tags:
        - Filaments
      summary: List filaments
      description: Removed filaments are not listed.
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: pageSize
          in: query
        - schema:
            $ref: "#/components/schemas/Material"
          required: false
          name: material
          in: query
        - schema:
            type: string
            enum:
              - "true"
              - "false"
            description: "true: only spools with grams left. false: only empty spools."
          required: false
          description: "true: only spools with grams left. false: only empty spools."
          name: inStock
          in: query
        - schema:
            type: string
            enum:
              - purchaseDate
              - brand
              - availableGrams
              - createdAt
            default: createdAt
          required: false
          name: sort
          in: query
        - schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          required: false
          name: order
          in: query
      responses:
        "200":
          description: One page of filaments. A page past the last one is empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilamentList"
        "400":
          description: Unknown or invalid query parameter.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/filaments/{id}:
    get:
      operationId: getFilament
      tags:
        - Filaments
      summary: Get one filament
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{24}$/i
            example: 66f0c0ffee0123456789abcd
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The filament.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Filament"
        "400":
          description: Malformed id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such filament, or it was removed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updateFilament
      tags:
        - Filaments
      summary: Edit a filament
      description: Send the `version` you last saw plus the fields to change.
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{24}$/i
            example: 66f0c0ffee0123456789abcd
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFilamentRequest"
      responses:
        "200":
          description: The updated filament, with its new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Filament"
        "400":
          description: Invalid input, or the merged state breaks a rule (availableGrams above initialGrams, or
            a purchase date in the future).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such filament, or it was removed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Stale version (issue path "version").
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteFilament
      tags:
        - Filaments
      summary: Remove a filament
      description: "Logical removal: the document is kept but no longer listed or readable."
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{24}$/i
            example: 66f0c0ffee0123456789abcd
          required: true
          name: id
          in: path
      responses:
        "204":
          description: Removed.
        "400":
          description: Malformed id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such filament, or it was already removed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/filaments/{id}/consume:
