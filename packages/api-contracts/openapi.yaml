  /api/v1/parts:
    post:
      operationId: createPart
      tags:
        - Parts
      summary: Register a part
      description: "Two parts may share a name: there is no uniqueness rule. A gcode `source` is stamped
        with `analyzedAt` by the server; sending it is a 400."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePartRequest"
      responses:
        "201":
          description: Created. The Location header points to the new part.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Part"
        "400":
          description: Invalid input or an unknown field.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listParts
      tags:
        - Parts
      summary: List parts
      description: Removed parts are not listed.
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: pageSize
          in: query
        - schema:
            $ref: "#/components/schemas/Material"
          required: false
          name: material
          in: query
        - schema:
            type: string
            enum:
              - name
              - createdAt
              - estimatedWeightGrams
              - estimatedPrintSeconds
            default: name
          required: false
          name: sort
          in: query
        - schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          required: false
          name: order
          in: query
      responses:
        "200":
          description: One page of parts. A page past the last one is empty.
