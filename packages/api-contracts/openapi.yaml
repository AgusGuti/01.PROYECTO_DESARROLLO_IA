          description: Unknown or invalid query parameter.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/parts/{id}:
    get:
      operationId: getPart
      tags:
        - Parts
      summary: Get one part
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{24}$/i
            example: 66f0c0ffee0123456789abcd
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The part.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Part"
        "400":
          description: Malformed id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such part, or it was removed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updatePart
      tags:
        - Parts
      summary: Edit a part
      description: Send the `version` you last saw plus the fields to change. `dimensionsMm` is replaced
        whole. `null` clears `description` or `suggestedPrinterName`. `analyzedAt` is stamped again
        only when the body carries a `source`.
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{24}$/i
            example: 66f0c0ffee0123456789abcd
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePartRequest"
      responses:
        "200":
          description: The updated part, with its new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Part"
        "400":
          description: Invalid input or an unknown field.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such part, or it was removed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Stale version (issue path "version").
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deletePart
      tags:
        - Parts
      summary: Remove a part
      description: 'Logical removal: the document is kept but no longer listed or readable. A part that
        live projects use is refused with 409 (issue path "projects"); ask `GET /parts/{id}/usage`
        and repeat with `removeFromProjects=true` to pull it from those projects first and then
        remove it.'
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{24}$/i
            example: 66f0c0ffee0123456789abcd
          required: true
          name: id
          in: path
        - schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "false"
            description: "true confirms the removal of a part that projects use: it is pulled from them first."
          required: false
          description: "true confirms the removal of a part that projects use: it is pulled from them first."
          name: removeFromProjects
          in: query
      responses:
        "204":
          description: Removed.
        "400":
          description: Malformed id or unknown query parameter.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such part, or it was already removed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Live projects use the part and removal was not confirmed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The project data is temporarily unavailable; nothing was removed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
