      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{24}$/i
            example: 66f0c0ffee0123456789abcd
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The printer (also when it is pending removal).
          content:
            application/json:
              schema:
