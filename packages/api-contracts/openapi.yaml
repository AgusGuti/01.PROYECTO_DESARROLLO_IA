                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid input, an unknown field, a repeated part or a part that does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such project, or it was removed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Stale version (issue path "version").
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The part data is temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteProject
      tags:
        - Projects
      summary: Remove a project
      description: "Logical removal: the document is kept but no longer listed or readable."
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{24}$/i
            example: 66f0c0ffee0123456789abcd
          required: true
          name: id
          in: path
      responses:
        "204":
          description: Removed.
        "400":
          description: Malformed id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such project, or it was already removed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/gcode-analyses:
    post:
      operationId: analyzeGcode
      tags:
        - G-code
      summary: Read the estimates from the head of a Cura G-code file
      description: "Stateless: nothing is stored and the text is never logged or returned. It answers 200
        because it creates no resource. Only Cura (Marlin or RepRap flavour) is recognised."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeGcodeRequest"
      responses:
        "200":
          description: The numbers found, with warning codes about how reliable they are.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GcodeAnalysis"
        "400":
          description: Invalid input, or the head is not a supported Cura header (issue path "head").
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The request body is over the size limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
webhooks: {}
