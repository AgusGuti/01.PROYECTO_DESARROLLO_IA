# Continuous integration (standard §12.2). It runs the same `npm run verify` you run locally,
# so "green on my machine" and "green in CI" mean the same thing.
# Third-party actions are pinned to a full commit SHA (§12.3); Dependabot keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: commit-message and secret scans read it
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Node dependencies from the lockfile
        run: npm ci

      - name: Prepare the Python environment
        run: node scripts/bootstrap.mjs --only=python

      - name: Install pinned tools (checksum verified)
        run: node scripts/bootstrap.mjs --only=tools

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: All quality gates
        run: npm run verify

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies from the lockfile
        run: npm ci

      - name: Create the local environment file
        run: cp .env.example .env

      - name: Start MongoDB
        run: docker compose up -d --wait mongo

      - name: Run the smoke test in a real browser
        run: npm run test:e2e
